<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <style>
        body { background-color: #f4f6f9; font-family: sans-serif; padding-top: 80px; }
        .contenedor-login { width: 340px; margin: 0 auto; background: white; padding: 25px; border: 1px solid #dcdfe6; border-radius: 8px; }
        h2 { text-align: center; color: #00509d; margin-top: 0; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #4e5969; font-size: 14px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #00509d; }
        button { width: 100%; padding: 10px; background-color: #e01e37; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:hover { background-color: #b7122a; }
        .alerta-error { color: #cc0000; background: #fdf2f2; padding: 8px; border-radius: 4px; text-align: center; font-size: 13px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="contenedor-login">
        <h2>Ingreso al Sistema</h2>
        <div class="campo">
            <label>Usuario:</label>
            <input type="text" id="username">
        </div>
        <div class="campo">
            <label>Contraseña:</label>
            <input type="password" id="password">
        </div>
        <button onclick="iniciarSesion()">Ingresar</button>
        <div id="boxError" class="alerta-error"></div>
    </div>

    <script>
        const BACKEND_URL = "http://localhost:5000";

        async function iniciarSesion() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const boxError = document.getElementById('boxError');
            boxError.style.display = 'none';

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('usuario_nombre', data.nombre);
                    window.location.href = "principal.html";
                } else {
                    boxError.innerText = "Usuario o contraseña incorrectos.";
                    boxError.style.display = 'block';
                }
            } catch (err) {
                boxError.innerText = "Error: No se pudo conectar con el servidor.";
                boxError.style.display = 'block';
            }
        }
    </script>
</body>
</html>
